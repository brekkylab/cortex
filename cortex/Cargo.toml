[package]
name = "cortex"
version.workspace = true
edition.workspace = true

[build-dependencies]
cc = { workspace = true }
pkg-config = { workspace = true }

[dependencies]
anyhow = { workspace = true }
# The console wire. The protocol's shape needs a *self-describing* codec — `params`
# and `result` are typed by a method that may arrive after them, and `result` xor
# `error` is decided by which member is present — and BSON is the self-describing
# one with a native byte type, which is most of what this channel carries.
bson = { workspace = true }
# `BoxFuture`, which is what every method on `Client` and `Server` hands back — see
# `console::base` for why they are boxed rather than `async fn`.
futures-core = { workspace = true }
fuser = { workspace = true, optional = true }
# The `errno` values a POSIX filesystem answers in: `Posix` maps an `io::ErrorKind` onto one,
# and a binding hands that number to the kernel. Unconditional, unlike the bindings' other
# dependencies: `tokio/process` already activates it on every unix build, so naming it here
# adds no crate to anyone's graph.
libc = { workspace = true }
object_store = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
# `process` for the server a `StdioClient` starts, `macros` for the `#[tokio::test]`s.
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt",
    "time",
] }

[dev-dependencies]
# A directory standing in for a mounted tree, which is what a `Mount` is from the far side: a
# path any process can open.
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
# No *binding* by default. The crate's own layers — `FileSystem`, `WorkFs`, the
# inode bookkeeping, the console — need nothing, and each interface binding brings
# a libfuse provider with it: enabling one by default charges every consumer for
# it. A consumer that mounts over HTTP has no reason to link libfuse.
#
# Count them with
#
#   cargo tree -p cortex --features <f> -e normal --prefix none | grep -v '^cortex' \
#       | sed 's/ (\*)$//' | sort -u | grep -c .
#
# `grep -c .` and not `wc -l`, which also counts the blank line `cargo tree` puts
# between workspace members and `sort -u` collapses to one. `-p cortex` matters
# too: without it the answer is the whole workspace's. Normal edges only, so the
# unconditional build-deps `cc`/`pkg-config` are not counted.
#
# The numbers themselves are deliberately not written down: they go stale on every
# dependency bump, and the conclusion does not depend on what they are — `fuse`
# brings a libfuse provider and `s3` the whole HTTP and TLS stack under
# `object_store`, whatever this month's count is.
#
# Consequence worth knowing: a bare `cargo test` runs a subset of the unit tests,
# because a binding's tests only exist when its feature is on. No default set fixes
# that — `fuse` and `fuse-t` are independent, so no single configuration covers
# every binding. Full coverage is a sweep:
#
#   export PKG_CONFIG_PATH="$PWD/cortex/contrib/pkgconfig:/usr/local/lib/pkgconfig"
#   for f in "" "--features fuse" "--features fuse-t" \
#            "--features fuse-no-mount" "--features s3" "--features notion" \
#            "--features fuse,fuse-t" \
#            "--features fuse,fuse-t,s3,notion"; do cargo test -p cortex $f --all-targets; done
#
# Note `cargo test $f` needs `$f` word-split, which zsh does not do for an
# unquoted expansion — under zsh pass the flags as separate arguments.
#
# Editors default to no features too, so a binding shows as inactive code until
# its feature is enabled (rust-analyzer: `"cargo.features": "all"`).
default = []
# Both bindings below also ask for `tokio/rt-multi-thread` and `tokio/net`: a
# binding is a *synchronous* callback over async stores, so it blocks on one
# process-wide runtime (`fs::mounts::block_on`), and `Builder::enable_all` is
# cfg'd on `net` and `time` — built without them the runtime silently has no I/O
# driver. `time` is already in the base set the console asks for.
# Mount a cortex filesystem on the host through FUSE.
#
# Needs a libfuse provider at build time. On macOS that is FUSE-T (kext-less,
# `brew install --cask fuse-t`) or macFUSE; both export the libfuse2 mount ABI
# fuser links against. FUSE-T ships `fuse-t.pc` rather than the `fuse.pc` that
# fuser's macOS branch probes for, so point `PKG_CONFIG_PATH` at the shim in
# `cortex/contrib/pkgconfig`:
#
#   PKG_CONFIG_PATH="$PWD/cortex/contrib/pkgconfig:/usr/local/lib/pkgconfig" cargo build -p cortex --features fuse
#
# Linux needs no provider — fuser opens /dev/fuse directly.
fuse = ["dep:fuser", "tokio/net", "tokio/rt-multi-thread"]
# Mount on macOS through FUSE-T, which needs no kernel extension.
#
# A separate binding rather than a flavour of `fuse`, because the two differ in
# who drives the session: `fuser` reads the FUSE protocol off the mount fd
# itself, while FUSE-T hands back a socket to its own helper and expects to drive
# the filesystem through libfuse-t's loop. Enabling both at once is fine — they
# are independent call surfaces over the same `Posix`.
fuse-t = ["tokio/net", "tokio/rt-multi-thread"]
# Compile and unit-test the FUSE adapter with no libfuse provider installed:
# skips fuser's pkg-config probe, so the adapter builds but cannot mount.
fuse-no-mount = ["fuse", "fuser/macos-no-mount"]
s3 = ["dep:object_store", "tokio/net", "tokio/rt-multi-thread"]
# A Notion workspace as a read-only backend: pages and their block trees rendered
# to `page.json` on read.
notion = [
    "dep:reqwest",
    "dep:uuid",
    "dep:chrono",
    "dep:serde_json",
    "tokio/net",
    "tokio/rt-multi-thread",
]
