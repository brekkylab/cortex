[package]
name = "cortex"
version.workspace = true
edition.workspace = true

[build-dependencies]
cc = { workspace = true }
pkg-config = { workspace = true }

[dependencies]
anyhow = { workspace = true }
# The console wire. The protocol's shape needs a *self-describing* codec — `params`
# and `result` are typed by a method that may arrive after them, and `result` xor
# `error` is decided by which member is present — and BSON is the self-describing
# one with a native byte type, which is most of what this channel carries.
bson = { workspace = true }
# `BoxFuture`, which is what every method on `Client` and `Server` hands back — see
# `console::base` for why they are boxed rather than `async fn`.
futures-core = { workspace = true }
# The `errno` values a POSIX filesystem answers in: `Posix` maps an `io::ErrorKind` onto one,
# and a binding hands that number to the kernel. Unconditional, unlike the bindings' other
# dependencies: `tokio/process` already activates it on every unix build, so naming it here
# adds no crate to anyone's graph.
libc = { workspace = true }
object_store = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
# The digest a built image is named by. Small and pure Rust, and already in this
# workspace's lockfile — `cortex-uvm-console` hashes layers with it. Unconditional
# rather than behind a feature, because `image` is a public API and an API that is
# off by default is one callers have to discover twice.
sha2 = { workspace = true }
unicode-normalization = { workspace = true, optional = true }
# `process` for the server a `StdioClient` starts, `macros` for the `#[tokio::test]`s.
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt",
    "time",
] }

# Each binding's dependencies sit under the target it binds on, and are optional there so that
# `mount` is what pulls them in: a build turns on one binding, the one its OS has, and a
# `--all-features` build finds nothing on a target without one rather than a dependency that
# cannot compile. The binding modules carry the matching `#[cfg(all(feature = "mount", …))]`.
#
# The macOS binding has no entry: FUSE-T is reached through `contrib/fuse_t/shim.c`, which
# `build.rs` compiles.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
fuser = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
dokan = { workspace = true, optional = true }
dokan-sys = { workspace = true, optional = true }
widestring = { workspace = true, optional = true }
winapi = { workspace = true, optional = true }

[dev-dependencies]
# `kill(pid, sig)`, to signal a child that is holding a mount. The `kill(1)`
# binary would do the same and is one fewer dependency, but it is not in every
# base image a Linux run happens in — `procps` is not installed in a slim
# Debian, and a test that cannot find it fails for the wrong reason.
libc = { workspace = true }
# A concrete format to round-trip a `Recipe` through. The type is format-agnostic —
# whatever a caller stores it as is theirs — so this is here to test that and not to
# name the one it must be.
serde_json = { workspace = true }
# A directory standing in for a mounted tree, which is what a `Mount` is from the far side: a
# path any process can open — and the build contexts the `image` tests hash, which want a
# real directory for the same reason.
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# `mount` by default, because mounting a tree on the host is what a consumer of this crate
# does. It is also the one default with a cost: on macOS and Windows it brings a FUSE
# provider with it, which the build or the binary then needs installed (see `mount`
# below). The crate's own layers — `FileSystem`, `Directory`, the inode bookkeeping, the
# console — need none of it, so a consumer that mounts over HTTP, or only runs commands,
# takes this crate with `default-features = false` and links no libfuse. The workspace's
# own dependency on it is declared that way, so each member names `mount` if it mounts.
#
# Count them with
#
#   cargo tree -p cortex --features <f> -e normal --prefix none | grep -v '^cortex' \
#       | sed 's/ (\*)$//' | sort -u | grep -c .
#
# `grep -c .` and not `wc -l`, which also counts the blank line `cargo tree` puts
# between workspace members and `sort -u` collapses to one. `-p cortex` matters
# too: without it the answer is the whole workspace's. Normal edges only, so the
# unconditional build-deps `cc`/`pkg-config` are not counted.
#
# The numbers themselves are deliberately not written down: they go stale on every
# dependency bump, and the conclusion does not depend on what they are — `mount`
# brings a FUSE provider and `s3` the whole HTTP and TLS stack under
# `object_store`, whatever this month's count is.
#
# Consequence worth knowing: a bare `cargo test` runs a subset of the unit tests,
# because a feature's tests only exist when it is on. Full coverage is a sweep:
#
#   for f in "--no-default-features" "" "--features s3" "--features notion" \
#            "--features gdrive" "--features s3,notion,gdrive"; do
#       cargo test -p cortex $f --all-targets
#   done
#
# Note `cargo test $f` needs `$f` word-split, which zsh does not do for an
# unquoted expansion — under zsh pass the flags as separate arguments.
#
# Editors build the default set, so `mount`'s binding is live code and the other
# features' are not until enabled (rust-analyzer: `"cargo.features": "all"`).
default = ["mount"]
# Mount a cortex filesystem on the host, through the one binding this OS has:
#
# | Target | Binding | Needs |
# |---|---|---|
# | Linux (any unix but macOS) | `fuser`, straight to `/dev/fuse` | nothing installed |
# | macOS | libfuse-t's own session loop | FUSE-T to build and run (`brew install --cask fuse-t`) |
# | Windows | Dokany's driver, through `dokan` | Dokany to run |
#
# All three also ask for `tokio/rt-multi-thread` and `tokio/net`: a binding is a
# *synchronous* callback over async stores, so it blocks on one process-wide runtime
# (`fs::mount::block_on`), and `Builder::enable_all` is cfg'd on `net` and `time` —
# built without them the runtime silently has no I/O driver. `time` is already in the
# base set the console asks for.
#
# **On macOS, FUSE-T has to be installed to build.** `build.rs` probes `fuse-t.pc` and
# fails without it, and the binary links `libfuse-t.dylib`, so it will not load on a
# machine without FUSE-T either.
#
# **On Windows, Dokany has to be installed to run** — the kernel driver (`dokan2.sys`)
# comes from Dokany's own installer and is what actually owns the volume. Building
# needs only a C compiler: `dokan-sys` links the installed user-mode library when the
# installer's `DokanLibrary2_LibraryPath_x64` is in the environment, and otherwise
# builds one from its vendored sources. Prefer the former — a self-built DLL can
# disagree with the installed driver's version, which fails at mount time rather than
# at build time.
#
# **On Windows it constrains a consumer's licence, and it is the only feature here
# that does.** Dokany's user-mode library is LGPL-3.0 and is linked dynamically, which
# is what keeps that to the library: a proprietary program may link it, and must leave
# it replaceable — which `dokan-sys` does for us by linking through an import library
# rather than statically. Nothing here may be rolled into a static binary without
# taking on LGPL §4(d0), which means shipping relinkable object code for the program
# around it.
mount = [
    "dep:fuser",
    "dep:dokan",
    "dep:dokan-sys",
    "dep:widestring",
    "dep:winapi",
    "tokio/net",
    "tokio/rt-multi-thread",
]
s3 = ["dep:object_store", "tokio/net", "tokio/rt-multi-thread"]
# Google Drive as a read-only backend: the folder tree as directories, and the
# Docs-editors types served as their own APIs' JSON rather than as an export.
gdrive = [
    "dep:reqwest",
    "dep:chrono",
    "dep:serde_json",
    "dep:unicode-normalization",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/sync",
]
# A Notion workspace as a read-only backend: pages and their block trees rendered
# to `page.json` on read.
notion = [
    "dep:reqwest",
    "dep:uuid",
    "dep:chrono",
    "dep:serde_json",
    "tokio/net",
    "tokio/rt-multi-thread",
]
