[package]
name = "virtx-node"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# `rlib` for a binding that builds virtx into its own addon (e.g. ailoy). Two addons cannot
# pass each other a `ConsoleClient`, since each links its own virtx and runtime, so such a binding
# links this crate and napi registers these classes into its addon.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
napi-build = "2"

[dependencies]
anyhow = "1"
virtx = { path = "../..", default-features = false }
napi = { version = "3", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "3"
tokio = { version = "1", features = ["sync"] }

[features]
default = ["mount", "ensure"]
mount = ["virtx/mount"]
ensure = ["virtx/ensure"]
s3 = ["virtx/s3"]
gdrive = ["virtx/gdrive"]
notion = ["virtx/notion"]
