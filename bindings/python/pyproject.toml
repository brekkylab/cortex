[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "virtx-py"
version = "0.1.0"
description = "The environment an agent works in: what it can see, and what it can do."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/brekkylab/virtx"
Documentation = "https://github.com/brekkylab/virtx/tree/main/bindings/python#readme"

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8", "pytest-asyncio>=1"]

[tool.maturin]
python-source = "python"
module-name = "virtx._virtx"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
