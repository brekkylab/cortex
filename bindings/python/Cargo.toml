[package]
name = "cortex-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# Imported as `cortex._cortex` and re-exported by `python/cortex/__init__.py`. Must match the
# `#[pymodule]` name, or the import finds a library with no init function.
#
# `rlib` for a binding that builds cortex into its own extension (e.g. ailoy). Two extension
# modules cannot pass each other a `ConsoleClient`, since each links its own cortex and runtime, so
# such a binding links this crate and registers its classes through `register` (src/lib.rs).
name = "_cortex"
crate-type = ["cdylib", "rlib"]

[dependencies]
# No default features, so this crate's `[features]` alone decide what a wheel carries.
cortex = { path = "../..", default-features = false }
# `abi3-py310`: one wheel per platform, not per interpreter. `extension-module` lives in
# `pyproject.toml` because it leaves libpython unlinked: right for the interpreter, wrong
# for `cargo test`.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
# Console methods need a tokio runtime (a stdio client drives a process), so Python
# awaitables are bridged onto one.
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
anyhow = "1"
tokio = { version = "1", features = ["sync"] }

[features]
default = ["mount", "ensure"]
mount = ["cortex/mount"]
ensure = ["cortex/ensure"]
s3 = ["cortex/s3"]
gdrive = ["cortex/gdrive"]
notion = ["cortex/notion"]
