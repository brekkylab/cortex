[package]
name = "virtx-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# The native half of the `virtx` package, imported as `virtx._virtx` and re-exported by
# `python/virtx/__init__.py`. The name here is what the `#[pymodule]` is called, and the
# two have to agree or the import finds a library with no init function in it.
#
# `rlib` as well, for a binding that builds virtx into its own extension — ailoy's does. Two
# extension modules cannot hand each other a `Console`: each links its own copy of virtx and
# of the runtime under it. So such a binding links this crate instead and registers its
# classes through [`register`](src/lib.rs), and its `Console` is the one its agent can take.
name = "_virtx"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` so that this crate's own features are what decide virtx's:
# a wheel is built with one set, and it should be the set named here.
virtx = { path = "../..", default-features = false }
# `abi3-py310`: one wheel per platform rather than one per interpreter. `extension-module`
# is not here but in `pyproject.toml`, because it leaves libpython unlinked, which is right
# for a module the interpreter loads and wrong for `cargo test`.
pyo3 = { version = "0.29", features = ["abi3-py310"] }
# Every `Console` method is a future that needs a tokio runtime under it — a stdio client
# spawns and talks to a process — so Python's awaitables are bridged onto one.
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
anyhow = "1"
tokio = { version = "1", features = ["sync"] }

[features]
default = ["mount", "ensure"]
mount = ["virtx/mount"]
ensure = ["virtx/ensure"]
s3 = ["virtx/s3"]
gdrive = ["virtx/gdrive"]
notion = ["virtx/notion"]
