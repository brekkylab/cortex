# Build the guest `wsx` binary for a Linux musl target without an external
# cross-linker: force the toolchain's bundled LLVM lld. Apple `ld` (the default
# on a macOS build host) rejects the GNU-style flags rustc emits for these
# targets. Scoped to wsx: Cargo discovers config by walking up from the CWD, so
# build wsx from this directory for these flags to apply.
#
#   cd wsx && cargo build --release --target aarch64-unknown-linux-musl
#   cd wsx && cargo build --release --target x86_64-unknown-linux-musl
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "linker-flavor=ld.lld"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "linker-flavor=ld.lld"]
