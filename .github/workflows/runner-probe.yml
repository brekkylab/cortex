# Temporary: which hosted runners this repository gets, and what they offer.
name: runner probe
on:
  push:
    branches: [ci/bindings-packages]
    paths: [.github/workflows/runner-probe.yml]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: environment
        shell: bash
        run: |
          uname -a
          echo "cpus: $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo $NUMBER_OF_PROCESSORS)"
          case "$RUNNER_OS" in
            Linux)
              ldd --version | head -1
              ls -la /dev/kvm /dev/fuse /dev/udmabuf 2>&1 || true
              id; command -v fusermount3 fusermount || true
              ;;
            macOS)
              sw_vers; sysctl -n machdep.cpu.brand_string
              sysctl kern.hv_support 2>&1 || true
              ;;
            Windows)
              systeminfo | grep -iE "OS Name|Hyper-V|Virtualization" || true
              ;;
          esac
          node --version; python3 --version || python --version; rustc --version || true
