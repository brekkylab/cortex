# Publish `/abin` — virtx's own executables, built for the guest.
#
# The release is named by the commit this runs on, so what gets checked out is what gets
# published: a release event checks out the tagged commit, a dispatch checks out whatever ref
# was chosen. `scripts/abin-release.sh` is the whole of the work; this file only arranges for
# it to have a toolchain and credentials, and splits it across a matrix.
#
# # Why moving `abin/latest` is a job of its own
#
# `abin/latest` holds the sha of the release a session uses when it has been told nothing —
# the **latest-pointer**. It must name a release that is *completely* uploaded, so each
# `build` job uploads only its own OS's tarballs and is told `--no-latest-pointer`, and the
# `latest-pointer` job runs after all of them and moves it once.
#
# A build that fails leaves its siblings' tarballs under a sha nothing refers to, which is
# inert rather than broken — that is what makes the split safe.
name: abin release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every target and stop, uploading nothing
        type: boolean
        default: false

# Never two releases at once: the second could move the latest-pointer while the first is
# still uploading. Queued rather than cancelled, because a run stopped between its tarballs
# and its latest-pointer leaves a state that is safe but untidy.
concurrency:
  group: abin-release
  cancel-in-progress: false

permissions:
  contents: read
  # For the OIDC token `configure-aws-credentials` exchanges for a role. No long-lived key is
  # stored anywhere for this.
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  build:
    strategy:
      # One entry today. The guest is Linux and the guest is the only consumer of `/abin`;
      # a host build would be needed only if the local console server is ever given one.
      #
      # Adding macOS is this, plus a line in `ALL_OSES` in the script:
      #
      #   - os: macos
      #     runner: macos-15
      #     zig: false      # Apple's clang cross-compiles Mach-O for both arches
      #
      # The key layout already carries the OS, so nothing published today has to move.
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            # Linux/musl needs a C cross-compiler for `rusqlite`'s bundled SQLite, which is
            # what zig supplies and what the host toolchain cannot.
            zig: true
      # Deliberate: one OS failing should not leave the others racing to finish uploads that
      # the latest-pointer will never refer to.
      fail-fast: true

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Pinned to the run's own commit rather than a moving ref, so every job in this
          # workflow builds and names the same release even if the branch moves underneath.
          ref: ${{ github.sha }}
          # The script warns when the commit is on no remote branch, and a shallow clone has
          # no remote-tracking branches to look in — it would warn on every run and mean
          # nothing by it.
          fetch-depth: 0

      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        env:
          # Pinned by digest and checked. This workflow holds credentials that can write what
          # every virtx guest executes, so what it runs is not left to whatever a mirror
          # serves today.
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild

      - name: Install the Rust targets
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            linux) rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl ;;
            *) echo "no targets known for ${{ matrix.os }}" >&2; exit 1 ;;
          esac

      # Skipped on a dry run, so the workflow can be exercised before the role exists — and
      # so a build-only run never holds credentials it has no use for.
      - name: Assume the publishing role
        if: ${{ !inputs.dry_run }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and upload
        run: |
          set -euo pipefail
          # `--no-latest-pointer` always: moving it is the `latest-pointer` job's, once every OS is in.
          args=(--os "${{ matrix.os }}" --no-latest-pointer)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          ./scripts/abin-release.sh "${args[@]}"

  latest-pointer:
    needs: build
    # Nothing was uploaded, so there is nothing to point at.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assume the publishing role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # No toolchain: this writes 41 bytes and compiles nothing, which is why the script
      # checks for zig only when it is going to build.
      - name: Move the latest-pointer
        run: ./scripts/abin-release.sh --latest-pointer-only
