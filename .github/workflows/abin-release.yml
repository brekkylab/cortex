# Publish `/abin` — cortex's own executables, built for the guest.
#
# The release is named by the commit checked out: the tagged commit on a release event, the
# chosen ref on a dispatch. `scripts/abin-release.sh` does the work; this file supplies a
# toolchain and credentials and splits it across a matrix.
#
# `abin/latest` (the **latest-pointer**) holds the sha a session uses when told nothing, and
# must name a fully uploaded release. So each `build` job uploads only its OS's tarballs with
# `--no-latest-pointer`, and the `latest-pointer` job moves it once after all of them. A
# failed build leaves tarballs under a sha nothing refers to, which is inert.
name: abin release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every target and stop, uploading nothing
        type: boolean
        default: false

# One release at a time, or a second could move the latest-pointer mid-upload. Queued, not
# cancelled: a run stopped between tarballs and pointer leaves a safe but untidy state.
concurrency:
  group: abin-release
  cancel-in-progress: false

permissions:
  contents: read
  # OIDC token `configure-aws-credentials` exchanges for a role; no long-lived key is stored.
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  build:
    strategy:
      # Linux only: the guest is the only consumer of `/abin`. Adding macOS is this, plus its
      # entries in the script's `ALL_OSES` and `targets_for`, a build path there without zig
      # (the script always runs `cargo zigbuild`), and a case in "Install the Rust targets":
      #
      #   - os: macos
      #     runner: macos-15
      #     zig: false      # Apple's clang cross-compiles Mach-O for both arches
      #
      # Keys already carry the OS, so nothing published has to move.
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            # zig is the C cross-compiler `rusqlite`'s bundled SQLite needs for musl.
            zig: true
      # One OS failing stops the others uploading what the latest-pointer will never name.
      fail-fast: true

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The run's own commit, so every job builds the same release if the branch moves.
          ref: ${{ github.sha }}
          # The script warns when the commit is on no remote branch; a shallow clone has no
          # remote-tracking branches, so it would warn on every run.
          fetch-depth: 0

      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        env:
          # Pinned by digest: this job holds credentials that write what every guest executes.
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild

      - name: Install the Rust targets
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            linux) rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl ;;
            *) echo "no targets known for ${{ matrix.os }}" >&2; exit 1 ;;
          esac

      # Skipped on a dry run: works before the role exists, and holds no unneeded credentials.
      - name: Assume the publishing role
        if: ${{ !inputs.dry_run }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and upload
        run: |
          set -euo pipefail
          # The `latest-pointer` job moves it, once every OS is in.
          args=(--os "${{ matrix.os }}" --no-latest-pointer)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          ./scripts/abin-release.sh "${args[@]}"

  latest-pointer:
    needs: build
    # Nothing was uploaded, so there is nothing to point at.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assume the publishing role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # No toolchain needed: this writes one small object and compiles nothing.
      - name: Move the latest-pointer
        run: ./scripts/abin-release.sh --latest-pointer-only
