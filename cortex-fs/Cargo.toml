[package]
name = "cortex-fs"
version.workspace = true
edition.workspace = true

[[bin]]
name = "apply_krun"
required-features = ["krun"]

[dependencies]
serde_json = { workspace = true }

msb_krun = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[features]
default = ["krun"]
# Boot microVMs directly on msb_krun and attach cortex filesystems to the guest.
krun = ["dep:msb_krun", "dep:libc", "dep:tempfile"]
