[workspace]
resolver = "3"
members = [
    "cortex",
    "cortex-execs/mem",
    "cortex-local-console",
]
# `cortex-uvm-guest` is the guest half of `cortex-uvm-console`: its own workspace root, because
# it is cross-compiled to `*-unknown-linux-musl` and a member would be built for the host by a
# bare `cargo build` — for a target that has no host to run on.
#
# `cortex-uvm-console` is out of the workspace mid-redesign, not because of how it is built. It
# served a `Posix<WorkFs>` into the guest as a **custom virtio-fs backend** and shipped the tree
# as a serialized spec; `cortex::fs` has neither now — a guest gets one of these trees the way
# anything else does, mounted on the host and passed in as a directory. It comes back once its
# boot path is that. Its source stays in the tree meanwhile.
exclude = ["cortex-uvm-guest", "cortex-uvm-console"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
# Declared for a consumer that wants the macro, not used by any member: `FileSystem`,
# `Client`, `Server` and `Executable` are async *and* object-safe (`dyn FileSystem`,
# `Box<dyn Client>`), which native `async fn` in traits cannot be — and they box their
# futures by hand, so the lifetimes are visible where the borrows are.
async-trait = "0.1"
# The console wire. Declared here rather than per crate because `Outcome::Result`
# carries a `Bson` in public API: two versions of it in one build would be a type
# error nobody could read.
bson = { version = "3", features = ["serde"] }
cortex = { path = "cortex", default-features = false }
cortex-fs = { path = "cortex-fs", default-features = false }
futures-core = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# Verifying a downloaded base rootfs against a pinned digest. A tarball that arrives over
# a link nobody controls decides what every command in every guest runs, so the check is
# not optional and a `shasum` binary that may or may not be spelled that way is not a
# dependency worth having.
sha2 = "0.10"
tempfile = "3"
tokio = "1"

# The in-process, Rust-native libkrun fork. Its `VmBuilder` exposes the
# `.fs(..).custom(..)` hook that attaches a custom `DynFileSystem` virtio-fs
# backend to the guest — the one thing the upstream libkrun C API and the
# high-level microsandbox SDK do not offer.
msb_krun = "0.1"

# Two image formats, in pure Rust, with no `mkfs` to shell out to: `ext4` formats
# the per-session writable upper, `erofs` writes the read-only base the guest
# overlays it onto, and `tar`/`tree` turn a rootfs tarball into the tree `erofs`
# encodes. Only `cortex-uvm-console` takes it — the crate that already links a
# hypervisor — so the tree it drags in is charged to the one consumer that boots
# a guest at all.
microsandbox-image = "0.6.7"

# Host-side FUSE. A sync trait whose methods take `&self`, so it drives the same
# `PosixFs` (interior mutability) that the krun binding does.
fuser = "0.17"
# A read-only S3 backend. `default-features = false` on purpose: the default set
# is `["fs"]`, which is object_store's *own* local-filesystem store and drags in
# walkdir/nix/same-file for a thing we already have in `PassthroughVolume`. The
# `memory` module is ungated, so the in-memory store the tests build on survives.
object_store = { version = "0.14", default-features = false, features = ["aws"] }

# The Notion backend: an async HTTP client, plus the two things its payloads are
# made of — page ids are UUIDs, and its timestamps are RFC 3339. reqwest 0.13
# renamed `rustls-tls` → `rustls` and made `query`/`form` optional; pagination
# uses `.query()`, so it is named.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "query",
] }
uuid = "1"
chrono = "0.4"
# Notion answers in JSON and `page.json` is rendered back to it, so the backend
# holds pages as `Value` rather than a mirror of a schema it does not own.
serde_json = "1"

# A memory store that is one file in a cortex tree. `bundled` on purpose: the store
# is a file a delegated executable opens on a mount, and which SQLite answers for it
# must not be whichever one the host happens to ship — the schema below uses an
# extension that is compiled against these headers.
rusqlite = { version = "0.40", features = ["bundled"] }
# Nearest-neighbour search inside that same file: a `vec0` virtual table, statically
# registered as an auto-extension rather than loaded from a `.dylib` nobody would
# have. Pinned off the 0.1.10 alphas, whose published crate is missing a `#include`d
# source file and does not compile.
sqlite-vec = "0.1.9"

# Compiles `contrib/fuse_t/shim.c` for the `fuse-t` feature. Only used then, but
# build-dependencies cannot themselves be optional.
cc = "1"
pkg-config = "0.3"
