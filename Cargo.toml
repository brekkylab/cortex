[workspace]
resolver = "3"
members = [
    "cortex",
    "cortex-execs/storebase",
    "cortex-execs/mem",
    "cortex-execs/index",
    "cortex-execs/docread",
    "cortex-console-servers/local",
    "cortex-console-servers/uvm/console",
    "cortex-console-servers/uvm/boot",
    "cortex-console-servers/uvm_v2/boot",
    "cortex-console-servers/uvm_v2/host",
]
# `cortex-uvm-guest` is the guest half of `cortex-uvm-console`: its own workspace root, because
# it is cross-compiled to `*-unknown-linux-musl` and a member would be built for the host by a
# bare `cargo build` — for a target that has no host to run on.
exclude = ["cortex-console-servers/uvm/guest", "cortex-console-servers/uvm_v2/guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
# Declared for a consumer that wants the macro, not used by any member: `FileSystem`,
# `Client` and `Server` are async *and* object-safe (`dyn FileSystem`, `Box<dyn Client>`),
# which native `async fn` in traits cannot be — and they box their futures by hand, so the
# lifetimes are visible where the borrows are.
async-trait = "0.1"
# The console wire. Declared here rather than per crate because `Outcome::Result`
# carries a `Bson` in public API: two versions of it in one build would be a type
# error nobody could read.
bson = { version = "3", features = ["serde"] }
cortex = { path = "cortex", default-features = false }
# The store format `mem` and `index` share: the tables, what a store says about
# itself, and how one is opened.
cortex-exec-storebase = { path = "cortex-execs/storebase" }
# The boot process, and — as its library half — the strings a console server starts one with.
# A server takes it without the `vm` feature and so links no VMM; see its own manifest.
cortex-uvm-boot = { path = "cortex-console-servers/uvm/boot", default-features = false }
futures-core = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# Verifying a downloaded base rootfs against a pinned digest. A tarball that arrives over
# a link nobody controls decides what every command in every guest runs, so the check is
# not optional and a `shasum` binary that may or may not be spelled that way is not a
# dependency worth having.
sha2 = "0.10"
tempfile = "3"
tokio = "1"

# The parser the programs in `cortex-execs/` are driven by, and where their `--help` comes
# from. Only those take it, which is what keeps an argument parser out of `cortex` — the same
# rule `rusqlite` follows.
clap = { version = "4", features = ["derive"] }

# The in-process, Rust-native libkrun fork. `VmBuilder` is what lets a boot be
# assembled out of parts this workspace already holds: tagged virtio-fs shares, two
# virtio-blk disks, and — the one that decides the design — a console port bound to a
# file descriptor the caller opened, which is how a session's socket reaches the guest
# with no pty and no file in between. The high-level microsandbox SDK boots images, not
# descriptors, and offers nowhere to hand one over.
msb_krun = "0.1"

# Two image formats, in pure Rust, with no `mkfs` to shell out to: `ext4` formats
# the per-session writable upper, `erofs` writes the read-only base the guest
# overlays it onto, and `tar`/`tree` turn a rootfs tarball into the tree `erofs`
# encodes. Only `cortex-uvm-console` takes it — the crate that already links a
# hypervisor — so the tree it drags in is charged to the one consumer that boots
# a guest at all.
microsandbox-image = "0.6.7"
olpc-cjson = "0.1"

# The userspace network stack a session with a network gets: smoltcp behind a policy engine,
# in this process rather than in a helper anyone has to install. Only `cortex-uvm-boot`'s `vm`
# feature takes it — the stack lives with the VM it serves.
#
# **The pin matters.** It requires an exact `msb_krun`, so the two versions here have to agree
# or a build ends up with two `NetBackend` traits and no way to hand one to the other.
microsandbox-network = "=0.6.12"

# Host-side FUSE. Its `Filesystem` methods take `&self`, so the binding is an `impl`
# on `Posix` itself rather than a wrapper holding one — the same shape `fuse-t` takes,
# over the same `Mutex`-held inode and open tables.
fuser = "0.17"
# A read-only S3 backend. `default-features = false` on purpose: the default set
# is `["fs"]`, which is object_store's *own* local-filesystem store and drags in
# walkdir/nix/same-file for a thing we already have in `PassthroughVolume`. The
# `memory` module is ungated, so the in-memory store the tests build on survives.
object_store = { version = "0.14", default-features = false, features = ["aws"] }

# The Notion backend: an async HTTP client, plus the two things its payloads are
# made of — page ids are UUIDs, and its timestamps are RFC 3339. reqwest 0.13
# renamed `rustls-tls` → `rustls` and made `query`/`form` optional; Notion's
# pagination uses `.query()` and Google's token endpoint takes a form body, so
# both are named.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "query",
    "form",
] }
uuid = "1"
chrono = "0.4"
# Notion answers in JSON and `page.json` is rendered back to it, so the backend
# holds pages as `Value` rather than a mirror of a schema it does not own.
serde_json = "1"

# One name, two spellings. macOS hands a lookup the decomposed form of whatever a
# listing returned, and a store may hold either — so a filesystem that compares names
# by their bytes answers `ENOENT` for a name it had just printed. Two crates, against
# `s3`'s 131.
unicode-normalization = "0.1"

# A memory store that is one file in a cortex tree. `bundled` on purpose: the store
# is a file a delegated executable opens on a mount, and which SQLite answers for it
# must not be whichever one the host happens to ship — the schema below uses an
# extension that is compiled against these headers.
rusqlite = { version = "0.40", features = ["bundled"] }
# Nearest-neighbour search inside that same file: a `vec0` virtual table, statically
# registered as an auto-extension rather than loaded from a `.dylib` nobody would
# have. Pinned off the 0.1.10 alphas, whose published crate is missing a `#include`d
# source file and does not compile.
sqlite-vec = "0.1.9"

# Bytes in a BSON document. A layer's data map is keyed by paths, and a path in a layer is
# whatever filesystem it came from allowed rather than necessarily UTF-8 — so it is stored as
# bytes. Without this, serde hands BSON a `Vec<u8>` as an array of integers, which is both
# several times larger and a different type coming back.
serde_bytes = "0.11"

# Compiles `contrib/fuse_t/shim.c` for the `fuse-t` feature. Only used then, but
# build-dependencies cannot themselves be optional.
cc = "1"
pkg-config = "0.3"
