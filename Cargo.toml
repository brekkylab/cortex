[package]
name = "cortex"
version = "0.1.0"
edition = "2024"

# Members share this crate's target directory and lockfile. A bare `cargo build`/`cargo test`
# still builds only `cortex`, the default member.
[workspace]
members = ["bindings/node", "bindings/python"]

[build-dependencies]
# Compile `contrib/fuse_t/shim.c` for `mount` on macOS. Unconditional because
# build-dependencies cannot be optional.
cc = "1"
pkg-config = "0.3"

[dependencies]
anyhow = "1"
# The console wire. It needs a self-describing codec (`params`/`result` are typed by a
# method that may arrive after them, and `result` xor `error` is decided by which is
# present), and BSON is one with a native byte type, which most payloads are.
bson = { version = "3", features = ["serde"] }
# `BoxFuture`, which every `Client` and `Server` method returns; `protocol::base` says why
# they are boxed rather than `async fn`.
futures-core = "0.3"
# The `errno` values `Posix` maps an `io::ErrorKind` onto for the kernel. Unconditional:
# `tokio/process` already pulls it into every unix build, so it adds no crate.
libc = "0.2"
# A read-only S3 backend. No default features: the default `fs` is object_store's own
# local store, pulling walkdir/nix/same-file for what `PassthroughFs` already does. The
# ungated `memory` store is what the tests build on.
object_store = { version = "0.14", default-features = false, features = [
    "aws",
], optional = true }
# HTTP for the Notion, Google Drive and OneDrive backends and `ensure_cortex`; `uuid` for
# Notion's page ids, `chrono` for RFC 3339 timestamps. `query` is for Notion's pagination,
# `form` for the Google and Microsoft token endpoints.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "query",
    "form",
], optional = true }
uuid = { version = "1", optional = true }
# The gzipped tar `ensure_cortex` unpacks (what cortex-krun's `cargo xtask upload` writes).
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
chrono = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
# Notion answers in JSON and `page.json` is rendered back to it, so the backend
# holds pages as `Value` rather than a mirror of a schema it does not own.
serde_json = { version = "1", optional = true }
# The digest a built image is named by. Small and pure Rust; unconditional because
# `image` is public API, and an API off by default has to be discovered twice.
sha2 = "0.10"
# macOS looks a name up in decomposed form whatever the listing returned, and a store may
# hold either, so comparing names by bytes answers `ENOENT` for a name just listed.
unicode-normalization = { version = "0.1", optional = true }
# `process` for the server a `StdioClient` starts, `macros` for the `#[tokio::test]`s.
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt",
    "time",
] }

# Each binding's dependencies sit under its target and are optional, so `mount` pulls in only
# the one this OS has, and `--all-features` finds nothing uncompilable on other targets. The
# binding modules carry the matching `#[cfg(all(feature = "mount", …))]`.
#
# macOS has no entry: FUSE-T is reached through `contrib/fuse_t/shim.c`, which `build.rs`
# compiles.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Host-side FUSE. Its `Filesystem` methods take `&self`, so the binding is an `impl` on
# `Posix` itself rather than a wrapper.
fuser = { version = "0.17", optional = true }

[target.'cfg(windows)'.dependencies]
# Links Dokany's user-mode DLL dynamically, which keeps its LGPL off consumers (see the
# `mount` feature). The kernel driver is installed on the host and never linked.
dokan = { version = "0.3", optional = true }
# The `FILE_CREATE`/`FILE_DIRECTORY_FILE` constants `create_file` decodes, which `dokan` does
# not re-export. Already in `dokan`'s graph, so naming it adds nothing.
dokan-sys = { version = "0.3", optional = true }
# UTF-16 strings, which every Dokan name is.
#
# **Pinned to `dokan`'s own 0.4, not the current 1.x.** `U16CStr` is in `dokan`'s public API,
# so a second version is an unrelated type and every callback fails to match its trait, with
# an error naming the same type twice.
widestring = { version = "0.4", optional = true }
# `NTSTATUS` and the `STATUS_*`/`FILE_ATTRIBUTE_*` codes a Windows filesystem answers in, and
# `LoadLibraryW`, which `mount_support` uses to check for Dokany before any call into it.
# winapi gates every module behind a feature (none by default), so only these are named.
winapi = { version = "0.3", features = [
    "libloaderapi",
    "ntdef",
    "ntstatus",
    "winnt",
], optional = true }

[dev-dependencies]
# `kill(pid, sig)` to signal a child holding a mount. Not the `kill(1)` binary: `procps` is
# missing from slim Debian images, and a test that cannot find it fails for the wrong reason.
libc = "0.2"
# A concrete format to round-trip a `Recipe` through; the type itself is format-agnostic.
serde_json = "1"
# Real directories: stand-ins for a mounted tree, and the build contexts `image` tests hash.
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
# `mount` by default, because mounting a tree on the host is what a consumer does. It is the
# one default with a cost: on macOS and Windows it needs a FUSE provider installed (see
# `mount` below). `FileSystem`, `Directory`, the inode bookkeeping and the console need none
# of it, so a consumer that mounts over HTTP or only runs commands takes
# `default-features = false` and links no libfuse.
#
# A feature's dependency count (normal edges only, so build-deps are excluded):
#
#   cargo tree --features <f> -e normal --prefix none | grep -v '^cortex' \
#       | sed 's/ (\*)$//' | sort -u | grep -c .
#
# A bare `cargo test` runs only the default features' tests. Full coverage is a sweep:
#
#   for f in "--no-default-features" "" "--features s3" "--features notion" \
#            "--features gdrive" "--features onedrive" \
#            "--features s3,notion,gdrive,onedrive"; do
#       cargo test $f --all-targets
#   done
#
# `$f` must word-split, which zsh does not do; under zsh pass the flags as separate arguments.
#
# Editors build the default set, so other features' code is inert until enabled
# (rust-analyzer: `"cargo.features": "all"`).
default = ["mount", "ensure"]
# Mount a cortex filesystem on the host, through the one binding this OS has:
#
# | Target | Binding | Needs |
# |---|---|---|
# | Linux (any unix but macOS) | `fuser`, straight to `/dev/fuse` | nothing installed |
# | macOS | libfuse-t's own session loop | FUSE-T to build and run (`brew install --cask fuse-t`) |
# | Windows | Dokany's driver, through `dokan` | Dokany to run |
#
# All three need `tokio/rt-multi-thread` and `tokio/net`: a binding is a synchronous
# callback over async stores, so it blocks on one process-wide runtime, and
# `Builder::enable_all` is cfg'd on `net` and `time` (without them the runtime silently has
# no I/O driver). `time` is already in the base set.
#
# **A binary built with it starts on a host without the provider**; only mounting fails.
# `fs::mount_support` reports what to install, and every binding's `try_new` asks it first,
# so importing the Python or Node binding never fails for callers who don't mount.
#
# **On macOS, FUSE-T must be installed to build, not to run.** `build.rs` needs `fuse-t.pc`
# for the headers; the shim links nothing and `dlopen`s `libfuse-t.dylib` on first mount.
#
# **On Windows, a binary must delay-load `dokan2.dll` to start without Dokany.** `/DELAYLOAD`
# is a `rustc-link-arg`, which reaches only the package that prints it, so each binary's own
# `build.rs` must ask; the bindings' two lines are the ones to copy.
#
# **On Windows, Dokany must be installed to run**: its installer provides the kernel driver
# (`dokan2.sys`) that owns the volume. Building needs only a C compiler: `dokan-sys` links the
# installed user-mode library when `DokanLibrary2_LibraryPath_x64` is set, otherwise builds
# its vendored copy. Prefer the installed one; a self-built DLL can mismatch the driver
# version, which fails at mount time rather than build time.
#
# **On Windows it constrains a consumer's licence, the only feature that does.** Dokany's
# user-mode library is LGPL-3.0, linked dynamically through an import library, so a
# proprietary program may link it but must leave it replaceable. Nothing here may go into a
# static binary without taking on LGPL §4(d0): shipping relinkable object code.
mount = [
    "dep:fuser",
    "dep:dokan",
    "dep:dokan-sys",
    "dep:widestring",
    "dep:winapi",
    "tokio/net",
    "tokio/rt-multi-thread",
]
# `ensure_cortex`: fetch the console server cortex-krun publishes, over HTTPS, into
# `cache_root()/bin` when a host has none. Brings in an HTTP and TLS stack.
#
# On by default, because a consumer that runs commands needs a server. cortex-krun opts
# out: it takes this crate for the protocol, and its static musl guest's TLS stack would
# need a C cross-compiler.
ensure = ["dep:reqwest", "dep:flate2", "dep:tar", "tokio/net"]
s3 = ["dep:object_store", "tokio/net", "tokio/rt-multi-thread"]
# Google Drive as a read-only backend: the folder tree as directories, and the
# Docs-editors types served as their own APIs' JSON rather than as an export.
gdrive = [
    "dep:reqwest",
    "dep:chrono",
    "dep:serde_json",
    "dep:unicode-normalization",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/sync",
]
# A Notion workspace as a read-only backend: pages and their block trees rendered
# to `page.json` on read.
notion = [
    "dep:reqwest",
    "dep:uuid",
    "dep:chrono",
    "dep:serde_json",
    "tokio/net",
    "tokio/rt-multi-thread",
]
# A OneDrive account as a read-only tree, over Microsoft Graph. `tokio/sync` because the
# token cache is held across the `.await` that mints a token, which `std::sync::Mutex`
# cannot be.
onedrive = [
    "dep:reqwest",
    "dep:chrono",
    "dep:serde_json",
    "dep:unicode-normalization",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/sync",
]
