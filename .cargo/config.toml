# Build the guest `wsx` binary for a Linux musl target without an external
# cross-linker: force the toolchain's bundled LLVM lld. Apple `ld` (the default
# linker driver on a macOS build host) rejects the GNU-style flags rustc emits
# for these targets.
#
# Kept as target rustflags (not RUSTFLAGS) so a direct
# `cargo build --target …` picks it up.
#
#   cargo build -p wsx --release --target aarch64-unknown-linux-musl
#   cargo build -p wsx --release --target x86_64-unknown-linux-musl
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "linker-flavor=ld.lld"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "linker-flavor=ld.lld"]
