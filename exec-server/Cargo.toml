[package]
name = "exec-server"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex = { path = "..", default-features = false }
# cortex's `Mountable` (and so `Bin::invoke`) is async; this sync HTTP server
# drives it by `block_on`ing on a small runtime.
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
# The forwarding integration test spawns the exec-server binary and drives it
# with the guest client from `wsx`.
wsx = { path = "../wsx" }
