[package]
name = "cortex-exec-docstore"
version.workspace = true
edition.workspace = true

# `docstore` is what a caller types, and the package name is not it: this is one program, and the
# name it answers to is the one in its usage line and in everything it says about itself.
[[bin]]
name = "docstore"
path = "src/main.rs"

[dependencies]
# RFC 3339 timestamps. A document carries when it was last written into the store, and the
# store is a file other tools read: a sortable, unambiguous spelling is worth a dependency.
chrono = { workspace = true }
# The argument parser, and the whole of the driving. It answers its own `--help`, including on
# each subcommand, which is the half a hand-written option loop always ends up missing.
clap = { workspace = true }
# Opening the store: the schema, `meta`, and the write that `memstore` keeps the same.
cortex-exec-storebase = { workspace = true }
# The store. `bundled` (from the workspace) on purpose: the schema is an FTS5 index, and FTS5
# is a compile-time option the host's own SQLite is free to have been built without. A store
# that opened and then answered every search with nothing is the failure being avoided.
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
