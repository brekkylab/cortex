[package]
name = "cortex-exec-memstore"
version.workspace = true
edition.workspace = true

# `memstore` against a directory on this host, with nothing mounted in front of it. The same
# `Executable` a consumer registers, so what it does here is what it does there; the
# difference is only who supplies the tree.
[[bin]]
name = "memstore"
path = "src/bin/main.rs"

[dependencies]
chrono = { workspace = true }
# The command line. `memstore` is several commands with different arities behind one name, and
# the help a caller reads has to be the flags the parser accepts — a hand-written usage string
# and a hand-written option loop are two places to say the same thing, which is one too many.
#
# The workspace one rather than a local declaration, for its `string` feature: one executable
# can be registered under several names, so the usage line has to carry the name it was invoked
# by, and without `string` a command's name can only be a `&'static str`.
#
# That one keeps `color`, which the local declaration used to drop. Colour is turned off at run
# time instead, by `cortex_exec_storebase::command::as_registered`, which every command here parses
# through — the same way `cortex-exec-index` does it. Deciding it there rather than in a feature
# is what makes it one rule instead of one per manifest.
clap = { workspace = true }
# `Executable`, `ExecCall`, `Mount` — the surface this crate implements, and
# `BoxFuture`, which is what `exec` hands back.
cortex = { workspace = true }
# Opening the store, and the shell around a registered command.
cortex-exec-storebase = { workspace = true }
rusqlite = { workspace = true }
# `rt` and `macros` for the binary's own runtime; nothing in the library needs a driver, since
# what it waits on is a store and a store does not wait.
tokio = { workspace = true, features = ["rt", "macros"] }
# Item identity. Ids leave this process — they are what a later `delete` or `history` would be
# given back — so they cannot be rowids that a re-import renumbers.
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
