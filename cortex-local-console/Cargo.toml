[package]
name = "cortex-local-console"
version.workspace = true
edition.workspace = true

[features]
default = []
# Mount a declared namespace where commands can see it. Without either, a session that
# declares volumes is answered MOUNT_FAILED — a console that only delegates needs neither,
# and neither is cheap (see cortex's own [features] for what each binding costs).
fuse = ["cortex/fuse"]
fuse-t = ["cortex/fuse-t"]

[dependencies]
anyhow = { workspace = true }
bson = { workspace = true }
cortex = { workspace = true }
# `kill(pid, 0)`, to tell an abandoned scratch directory from a live one.
libc = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
] }

[build-dependencies]
# Only to learn where `libfuse-t.dylib` lives, so the binary can carry an rpath to it.
# See `build.rs` for why nothing else can supply that.
pkg-config = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
