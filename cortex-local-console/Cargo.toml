[package]
name = "cortex-local-console"
version.workspace = true
edition.workspace = true

# No features. There were two — `fuse` and `fuse-t`, to mount a namespace a client declared on
# `init` where commands could see it — and both went with the declaration: `cortex::fs` no longer
# carries a tree over the wire, so this backend has nothing to mount and needs no binding to
# mount it with. Wiring the two halves back together is its own piece of work.

[dependencies]
anyhow = { workspace = true }
bson = { workspace = true }
cortex = { workspace = true }
# `kill(pid, 0)`, to tell an abandoned scratch directory from a live one.
libc = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
] }

[build-dependencies]
# Only to learn where `libfuse-t.dylib` lives, so the binary can carry an rpath to it.
# See `build.rs` for why nothing else can supply that.
pkg-config = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
