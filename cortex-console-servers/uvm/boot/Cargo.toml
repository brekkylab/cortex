[package]
name = "cortex-uvm-boot"
version.workspace = true
edition.workspace = true

# The process that becomes a micro-VM, and the contract a console server starts it with.
#
# **Two targets with very different dependencies, on purpose.** The library is the handful of
# strings the server and the boot process agree on and takes little but `anyhow`, `serde` and
# `strum` (a derive for one enum's text form); the binary is the only thing in this workspace
# that links a VMM. A server depends on this
# package with `default-features = false` and so gets the contract without the hypervisor, the
# TLS stack or the DNS stack behind it.
#
# The binary is its own process rather than a role of the server's because on macOS whatever
# calls `hv_vm_create` has to carry an entitlement, and an entitlement is carried by a code
# signature: something has to be copied and signed on the way to every boot. Making that
# something this binary rather than the server keeps the artifact that gets signed small — and
# the server embeds it, so there is still nothing for a consumer to install.
#
# Nothing crosses between the two but the library: a boot is told what to do entirely through
# its environment, which is what made splitting it a move rather than a rewrite.

[lib]
path = "src/lib.rs"

# `required-features` is why a bare `cargo build` at the workspace root produces the library
# and no binary. What builds the binary is `cortex-uvm-console`'s build script, which invokes
# cargo again with `--features vm` and embeds the result — the same shape it already uses for
# the guest, and for the same reason: a target whose dependencies have no business in anyone
# else's graph is built by itself.
[[bin]]
name = "cortex-uvm-boot"
path = "src/main.rs"
required-features = ["vm"]

[features]
# Everything the binary needs and the library must not have.
vm = [
    "dep:msb_krun",
    "dep:microsandbox-network",
    "dep:libc",
    "dep:tokio",
    "dep:rustls",
    "dep:tracing-subscriber",
]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
# `Display` and `FromStr` for `Inject`, so a location round-trips through the `--secret` string
# without a match written by hand on each side.
strum = { workspace = true }
# `dup(2)`, to hand the guest a copy of this process's stderr as its console.
libc = { workspace = true, optional = true }
# `blk` for the two disks the guest overlays into a root; `net` for the virtio-net device a
# session with a network gets.
msb_krun = { workspace = true, features = ["blk", "net"], optional = true }
# The network a session with one gets. Its stack runs here rather than in the server, because
# what `VmBuilder` takes is an in-process backend object and not a socket — so whatever owns
# the VM is what has to own the stack.
microsandbox-network = { workspace = true, optional = true }
# The stack's poll loop is async and wants a runtime of its own, held for as long as the VM is
# up. Nothing else in this binary waits for anything, which is why it is behind the feature.
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
# Only to install a process-level default `CryptoProvider` for `microsandbox-network`'s TLS
# interception: the crate builds rustls configs that read the default and installs none, and two
# providers in the graph leave it ambiguous. `ring` is the one the crate itself uses.
rustls = { version = "0.23", features = ["ring"], optional = true }
# So the network stack's own diagnostics — a secret heading to a disallowed host, an upstream
# that would not verify — reach this process's stderr under `RUST_LOG`. Nothing here logs
# without it: the stack emits through `tracing`, which drops every event until a subscriber is set.
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
