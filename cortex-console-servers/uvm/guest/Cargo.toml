# Its own workspace root. This crate is only ever built for
# `*-unknown-linux-musl` — it runs inside the guest and has no host to run on —
# so being a member of the outer workspace would mean a bare `cargo build`
# compiling it for darwin, where `mount(2)` and `pivot_root` do not exist.
#
# `cortex-uvm-console`'s build script cross-compiles it and embeds the result.
[workspace]

[package]
name = "cortex-uvm-guest"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "cortex-uvm-guest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# The same version cortex takes, and for the same reason it is pinned there rather than
# per crate: `Outcome::Result` carries a `Bson`, so two versions of it in one build would
# be a type error nobody could read.
bson = { version = "3", features = ["serde"] }
# The console wire, and only that. A path dependency across the workspace
# boundary rather than a copy of the codec: the frames this end reads are the
# frames the client wrote, so there is one definition of them or there are two
# that drift. Default features, so no binding comes with it — a guest agent
# mounts nothing and boots nothing.
cortex = { path = "../../../cortex", default-features = false }
# `mount(2)`, `pivot_root`, `dup`. Every one of them is a syscall with no std
# spelling, which is the whole reason the guest side is its own binary.
libc = "0.2"
# Deriving `contract::ImageSpec`, the one thing the host hands this end as a file
# rather than as an environment value. Already in the tree via `bson`; named here
# because the derive macro has to be.
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
] }

# This binary is embedded in `cortex-uvm-console` and written into every boot
# root, so its size is paid on every cold start.
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
