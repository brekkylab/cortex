[package]
name = "cortex-uvm-console"
version.workspace = true
edition.workspace = true

[build-dependencies]
anyhow = { workspace = true }

[dependencies]
anyhow = { workspace = true }
bson = { workspace = true }
# The protocol, and nothing else: what this crate puts in front of a guest is a directory
# on this host, which is what `msb_krun` shares — cortex has no guest-shaped path through
# it and does not need one here.
cortex = { workspace = true }
# The contract a boot is started with — this package's library half. Taken without its `vm`
# feature, which is what keeps the VMM it carries out of this binary's dependency graph. The
# binary itself is built and embedded by `build.rs`, not linked.
cortex-uvm-boot = { workspace = true }
# `dup(2)`, to hand a boot child a copy of this process's stderr as its stdout. A guest's
# kernel log is not the protocol and must not reach stdout, which is.
libc = { workspace = true }
# The image tooling: `ext4` formats the session's writable upper, `tar` and `tree` turn a
# rootfs tarball into a file tree, `erofs` writes that tree as the read-only base, and
# `registry` pulls an OCI image to be one instead.
microsandbox-image = { workspace = true }
# Deriving `ImageSpec`, the one thing a boot hands the guest as a file rather than as an
# environment value — see `contract::IMAGE_SPEC_PATH`.
serde = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "time",
] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
