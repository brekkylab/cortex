[package]
name = "cortex-uvm-v2"
version.workspace = true
edition.workspace = true

# The second take on the micro-VM console server. It lives beside `uvm/` rather than
# replacing it so the two can be built and run against the same client while this one
# is incomplete; nothing here is shared with the first, which is the point.
#
# Two binaries, one package: the host half answers a console session, the guest half runs
# inside the VM that half brings up. They are two targets rather than two modes of one
# because they are cross-compiled apart — the guest is built for `*-unknown-linux-musl`,
# and a host half that links a hypervisor has nothing to be there. What they agree on —
# the wire between them, and the names they call things by — belongs in a library here,
# built for both, once there is any.
#
# Each half gets a directory rather than a file under `src/bin/`, so that its own modules
# sit beside the `main.rs` that uses them and neither half can reach into the other's by
# accident — only through that shared library, which is the point of having one.

[[bin]]
name = "cortex-uvm-v2-host"
path = "src/host/main.rs"

[[bin]]
name = "cortex-uvm-v2-guest"
path = "src/guest/main.rs"

[dependencies]
anyhow = { workspace = true }
# The two sidecars an image is kept with: a layer's data map, and an image's manifest.
# Neither is ever read by anything but this server, so what they want is a format that
# holds path bytes and round-trips a `Vec<String>` — not one anybody has to look at.
bson = { workspace = true }
# The protocol, and nothing else this crate has a use for yet: `StdioServer` is what
# owns this process's stdin and stdout once they are the wire. No binding feature —
# what goes in front of a guest is a host directory, not anything cortex mounts here.
cortex = { workspace = true }
# `kill(pid, 0)`, to ask whether the pid a leftover scratch path is named for is still
# alive. Nothing else answers that without sending a signal or shelling out to `ps`.
libc = { workspace = true }
microsandbox-image = { workspace = true }
olpc-cjson = { workspace = true }
# Deriving the two sidecars above.
serde = { workspace = true }
# A layer's data map keys files by path, and a path is bytes — a map that could hold only
# UTF-8 would be a layer that could not be stored.
serde_bytes = { workspace = true }
# `image build -r` takes a declaration on the command line, and JSON is the shape a
# `RootFsV2` is passed around in everywhere else.
serde_json = { workspace = true }
# Layer ids, which are digests of what the layer was made from.
sha2 = { workspace = true }
# `io-std` for the two descriptors the protocol is, `macros` for `#[tokio::main]`,
# and the multi-threaded runtime it defaults to — see `host/main.rs` for why that
# and not a current-thread one.
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
] }

[dev-dependencies]
# A store to put layers in that goes away with the test that made one.
tempfile = { workspace = true }
