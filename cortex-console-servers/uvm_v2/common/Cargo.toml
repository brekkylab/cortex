[package]
name = "cortex-uvm-v2-common"
version.workspace = true
edition.workspace = true

# What the three halves of the micro-VM console server say to each other, and nothing else.
#
# A library rather than a module in any one of them, because none of the three can reach into
# the others: `cortex-uvm-v2-host` links no hypervisor, `cortex-uvm-v2-boot` is spawned by the
# host as a file beside it rather than depended on, and `cortex-uvm-v2-guest` is a workspace of
# its own cross-compiled to musl. This is the one edge all three do have, so it is the only
# place a constant they all spell can be written once.
#
# It is therefore kept to what crosses a process boundary. Anything that would drag a
# dependency in — a VMM, an image format, a runtime — belongs to whichever half needs it,
# because a dependency here is a dependency in all three graphs, one of which is signed and
# one of which is a static ELF built for the inside of a VM.

[dependencies]
# `Network::parse` and `BootArgs::parse` refuse a spelling they do not know, and the caller
# reports it.
anyhow = { workspace = true }
# `ImageSpec` and `GuestCommit` cross a boundary as BSON; the codec is the reader's, the
# derives are here. `hostcall` carries no derives at all — its wire is bytes described in
# prose and written out at both ends, for the reason its module docs give.
serde = { workspace = true }
